<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>

    <!-- Adicionar a Tela de Inicio: abre em tela cheia, com o icone da marca. -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#FAF7F5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="MARCO" />
    <!-- "default" deixa a barra de status opaca e o conteudo abaixo dela, que e
         o que combina com um app de fundo claro. "black-translucent" jogaria a
         tela para tras do relogio. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
        /* mesmo fundo da primeira tela, para nao piscar branco ao abrir */
        background-color: #faf7f5;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>Este aplicativo precisa de JavaScript para funcionar.</noscript>
    <div id="root"></div>
  </body>
</html>
